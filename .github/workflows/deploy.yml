# Merge to main ships it. Solo repo, so the pull request is the whole review
# gate: once a change is on main it deploys with nothing further to click
# (ADR-0025, retiring ADR-0021's reviewer gate and restoring ADR-0009's
# "merging deploys"). There is no staging environment to promote through,
# and neither deploy job names a GitHub environment: the `production`
# environment is deleted, not just stripped of its reviewer rule, because a
# job that still named one could be re-gated by a settings click with no
# diff for anyone to review. Re-gating now means editing this file.
#
# Tests run again here even though CI already ran them on the PR: a direct
# push to main skips the PR entirely, and "deployed a red build" is the one
# failure this pipeline exists to prevent.
#
# Auth is Workload Identity Federation — no long-lived service-account key
# in a public repo's secrets. The provider's attribute condition only
# exchanges tokens for runs on refs/heads/main (ADR-0021, still in force),
# so no other branch of this repo can mint the deployer credential, and that
# ref pin is now the only thing standing between a branch and production.
# Setup: api/deploy/setup-cicd.sh
name: deploy

on:
  push:
    branches: [main]
  # Escape hatch: redeploy without a commit (rollback, or a deploy that
  # failed on something other than the code).
  workflow_dispatch:
    inputs:
      target:
        description: which service to deploy
        type: choice
        options: [both, api, web]
        default: both

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

# Serialise deploys; never cancel one mid-flight, since a half-applied
# Cloud Run revision is worse than a queued one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: doug-prod0
  REGION: us-central1

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          DISPATCH: ${{ github.event.inputs.target }}
        run: |
          api=false; web=false
          if [ -n "$DISPATCH" ]; then
            case "$DISPATCH" in
              both) api=true; web=true ;;
              api)  api=true ;;
              web)  web=true ;;
            esac
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            # First push, force-push, or a pruned ref: no usable range, so
            # deploy both. Redeploying is idempotent; skipping is not.
            echo "no usable diff range — deploying both"
            api=true; web=true
          else
            files=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            echo "$files"
            # grep returning 1 must not kill the step under `set -e`.
            if echo "$files" | grep -q '^api/'; then api=true; fi
            # The Job receives this document's hash as deployment config.
            # Refresh it even when the governing text is the only change.
            if echo "$files" | grep -qx \
              'docs/design/outcome-loop/publication-preregistration.md'; then api=true; fi
            if echo "$files" | grep -q '^web/'; then web=true; fi
            # Root workspace lockfile / manifests / Node image build path
            # all change what doug-web ships, even with no web/ file touch.
            if echo "$files" | grep -qxE 'package(-lock)?\.json'; then web=true; fi
            if echo "$files" | grep -qxE \
              'api/deploy/(gcp\.sh|cloudbuild-node\.yaml)'; then web=true; fi
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "api=$api web=$web" >> "$GITHUB_STEP_SUMMARY"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      # Full history, same reason the changes job above needs it:
      # scripts/read_budget_gate.py pins END_SHA=135c8e5 and walks 30
      # first-parent commits back from it, and test_read_budget_scripts.py
      # asserts that sample's exact result. A depth-1 checkout cannot resolve
      # that SHA, so `git log ... 135c8e5` exits 128 and the suite fails here
      # while passing on every developer clone. This gate is what ships the
      # API, so the failure blocked deploys entirely rather than just going
      # red — doug-api stayed on the pre-merge revision after #57 landed.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Check federation is configured
        env:
          PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          # Fail visibly with the fix, rather than an opaque OIDC error.
          # Skipping silently would be worse: a deploy that quietly does
          # nothing looks exactly like a deploy that worked.
          if [ -z "$PROVIDER" ] || [ -z "$DEPLOY_SA" ]; then
            echo "::error::Workload Identity is not configured. Run:"
            echo "::error::  PROJECT=doug-prod0 REPO=${{ github.repository }} bash api/deploy/setup-cicd.sh"
            echo "::error::then set the GCP_WIF_PROVIDER and GCP_DEPLOY_SA repo variables it prints."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      # gcp.sh stages the revision with no traffic, smoke-tests its tagged
      # URL, promotes only on a 200, then refreshes doug-adjudicator from the
      # promoted revision's exact image. A failed candidate never serves,
      # and the previous revision keeps 100%.
      - run: bash deploy/gcp.sh deploy
        env:
          PROJECT: ${{ env.PROJECT }}
          REGION: ${{ env.REGION }}
      - name: Confirm the live URL after promotion
        run: |
          # The candidate gate lives in gcp.sh; this re-checks the real
          # serving URL post-promotion. /healthz is intercepted by the
          # Google frontend and never reaches the app; openapi.json is a
          # real route.
          url=$(gcloud run services describe doug-api \
            --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url/openapi.json")
          echo "$url/openapi.json -> $code"
          [ "$code" = "200" ] || exit 1
          echo "api + adjudicator deployed: $url" >> "$GITHUB_STEP_SUMMARY"

  web:
    # needs api, but must NOT inherit its skip. web/ now fetches
    # /v1/showcase/queue, so a web revision that goes live before the api
    # revision serving that route falls back to the bundled fixture on BOTH
    # public pages — and promote_if_healthy smokes `/`, which returns 200
    # either way, so nothing would catch it.
    # The `!cancelled()` guard is load-bearing: on a web-only change the api
    # job is skipped by its own `if`, and a job whose dependency skipped is
    # skipped too. Without it, web-only changes would silently stop deploying.
    # `!failure()` still blocks web when api ran and failed.
    needs: [changes, api]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --workspace=web
      - run: npm run build --workspace=web
      - name: Check federation is configured
        env:
          PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          # Fail visibly with the fix, rather than an opaque OIDC error.
          # Skipping silently would be worse: a deploy that quietly does
          # nothing looks exactly like a deploy that worked.
          if [ -z "$PROVIDER" ] || [ -z "$DEPLOY_SA" ]; then
            echo "::error::Workload Identity is not configured. Run:"
            echo "::error::  PROJECT=doug-prod0 REPO=${{ github.repository }} bash api/deploy/setup-cicd.sh"
            echo "::error::then set the GCP_WIF_PROVIDER and GCP_DEPLOY_SA repo variables it prints."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      # Same staged flow as the api: candidate revision, smoke test on the
      # homepage (the readiness probe only proves the server binds its
      # port), promote on 200. A web build that 500s every route now goes
      # red without ever serving.
      # gcp.sh builds the web image from the monorepo root (workspaces),
      # then deploys that image — no more --source ../web.
      - name: Deploy
        working-directory: api
        run: bash deploy/gcp.sh web
        env:
          PROJECT: ${{ env.PROJECT }}
          REGION: ${{ env.REGION }}
      - name: Confirm the live URL after promotion
        run: |
          url=$(gcloud run services describe doug-web \
            --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          bash web/scripts/smoke-auth-entry.sh "$url"
          echo "web deployed: $url" >> "$GITHUB_STEP_SUMMARY"
