name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # doug-console is a separate app (console/) from doug-web, with its own
  # lib tests — nothing above exercises it. It is deliberately not wired
  # into deploy.yml (api/deploy/gcp.sh explains why: it's IAM-gated, so a
  # deploy stays a human-run `gcp.sh console`), but that makes PR-time
  # coverage the only automated check it gets before shipping to a service
  # holding the unscoped operator credential.
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  # The images that actually serve prod are otherwise built for the first
  # time *during* the prod deploy (gcloud run deploy --source) — a broken
  # Dockerfile or base-image regression surfaced there, mid-merge, and
  # nowhere earlier. Building them here catches that at PR time. Bases are
  # digest-pinned in the Dockerfiles, so this exercises the same layers the
  # deploy will.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build api

  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build web

  # console/Dockerfile is byte-identical to web/Dockerfile, but that's
  # exactly why this can't be skipped: both Docker failures this branch hit
  # (a package.json missing an `overrides` block, breaking `npm ci` from a
  # clean checkout; console/public/ not existing, breaking the final COPY)
  # were specific to the console build context, not the shared Dockerfile
  # text, and neither api-image nor web-image above could have caught them.
  console-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build console
