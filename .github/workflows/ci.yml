name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      # Full history: scripts/read_budget_gate.py pins END_SHA=135c8e5 and
      # walks 30 first-parent commits back from it, on purpose — it is a
      # fixed historical sample, and test_read_budget_scripts.py asserts its
      # exact result. The default depth-1 checkout cannot resolve that SHA,
      # so `git log ... 135c8e5` exits 128 and the test fails in CI while
      # passing on any developer clone. That is how #56 merged red.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --workspace=web
      - run: npm test --workspace=web
      - run: npm run build --workspace=web

  # doug-console is a separate app (console/) from doug-web, with its own
  # lib tests — nothing above exercises it. It is deliberately not wired
  # into deploy.yml (api/deploy/gcp.sh explains why: it's IAM-gated, so a
  # deploy stays a human-run `gcp.sh console`), but that makes PR-time
  # coverage the only automated check it gets before shipping to a service
  # holding the unscoped operator credential.
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test --workspace=console
      - run: npm run lint --workspace=console
      - run: npm run build --workspace=console

  # The images that actually serve prod are otherwise built for the first
  # time *during* the prod deploy — a broken Dockerfile or base-image
  # regression surfaced there, mid-merge, and nowhere earlier. Building
  # them here catches that at PR time. Bases are digest-pinned in the
  # Dockerfiles, so this exercises the same layers the deploy will.
  # Node apps use root context + -f Dockerfile (npm workspaces).
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t doug-api-candidate api
      # Building proves the image assembles; it does not prove the image can
      # do its job. doug-adjudicator runs from this image and shells out to
      # git, and a `docker build` that never runs the result stayed green
      # through every day the Job spent dying on FileNotFoundError: 'git'.
      # Assert the runtime contract, not the build.
      - name: The image carries the binaries its workloads shell out to
        run: docker run --rm doug-api-candidate git --version

  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f web/Dockerfile .

  # console/Dockerfile mirrors web's root-context pattern, but that's
  # exactly why this can't be skipped: prior failures (missing overrides,
  # missing console/public/) were specific to the console package graph
  # and neither api-image nor web-image could have caught them.
  console-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f console/Dockerfile .
