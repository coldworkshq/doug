# Doug review — drop into <your-repo>/.github/workflows/doug-review.yml
#
# On every PR, asks the hosted Doug service for a verdict and writes it to
# the job summary. Read-only by design: no comments, no failing checks —
# Doug never blocks a merge. Requires two repo secrets:
#   DOUG_API_URL   e.g. https://doug-api-xxxx.run.app
#   DOUG_API_TOKEN the value of the doug-api-token secret in GCP
name: doug-review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Score with Doug
        # Advisory by definition: a Doug outage must never redden a PR.
        continue-on-error: true
        env:
          DOUG_API_URL: ${{ secrets.DOUG_API_URL }}
          DOUG_API_TOKEN: ${{ secrets.DOUG_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Fork PRs run without repository secrets — skip rather than fail.
          if [ -z "$DOUG_API_URL" ] || [ -z "$DOUG_API_TOKEN" ]; then
            echo "Doug: no credentials in this context (fork PR?) — skipped. Doug never blocks a merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          verdict=$(curl -sS --fail-with-body -X POST "$DOUG_API_URL/v1/review" \
            -H "content-type: application/json" \
            -H "x-doug-token: $DOUG_API_TOKEN" \
            -H "x-github-token: $GH_TOKEN" \
            -d "{\"repo\": \"$REPO\", \"pr_number\": $PR}")
          echo "$verdict" | python3 -c "
          import json, sys
          v = json.load(sys.stdin)
          band, score, thr = v['band'], v['score'], v['threshold']
          icon = 'FLAGGED' if band == 'flagged' else 'cleared'
          print(f'## Doug: {icon} - score {score:.2f} (threshold {thr:.2f})')
          if v['reasons']:
              print()
              print('| signal | detail |')
              print('|---|---|')
              for r in v['reasons']:
                  rule, label = r['rule'], r['label']
                  print(f'| \`{rule}\` | {label} |')
          else:
              print()
              print('No findings.')
          # No double quotes in this Python: the -c argument is itself a
          # double-quoted shell string, so one aborts the summary (and the
          # risk verdict above) before anything writes.
          devs = v.get('deviations') or []
          if devs or v.get('intent_alignment') is not None:
              print()
              print('### Against recorded decisions')
              refs = ', '.join(v.get('intent_refs') or []) or 'none'
              align = v.get('intent_alignment')
              print(f'Read against: {refs} - alignment {align}/100')
              if devs:
                  print()
                  print('| type | severity | decision | detail |')
                  print('|---|---|---|---|')
                  for d in devs:
                      dtype, sev, desc = d['type'], d['severity'], d['description']
                      print(f'| {dtype} | {sev} | {refs} | {desc} |')
              else:
                  print()
                  print('No deviations.')
              print()
              print('_Deviations are advisory only and do not affect the score above._')
          print()
          print('_Doug routes attention; it never blocks a merge._')
          " >> "$GITHUB_STEP_SUMMARY"
