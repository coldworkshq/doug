[project]
name = "doug-api"
version = "0.1.0"
description = "Doug — risk-routed code review. Deterministic routing API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.140.7",
    "githubkit[auth-app]>=0.16.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "anthropic>=0.120.2",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "scikit-learn>=1.9.0",
]

[project.scripts]
doug-backtest = "doug.backtest.cli:main"
doug-review = "doug.review:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doug"
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
