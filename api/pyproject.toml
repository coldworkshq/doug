[project]
name = "doug-api"
version = "0.1.0"
description = "Doug — risk-routed code review. Deterministic routing API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic[vertex]>=0.120.2",
    "fastapi>=0.140.7",
    "githubkit[auth-app]>=0.16.0",
    # doug/tracing.py's only import, and the only place this repo touches it.
    # ADR-0031. It pulls the OpenTelemetry SDK in with it and installs a global
    # tracer provider on first use, which is why construction is lazy and
    # happens only when DOUG_TRACING is on.
    "langfuse>=4.15.1",
    # doug/workos_client.py's only transport. Importable today only because
    # githubkit pulls it in; a dependency this codebase calls directly must be
    # declared, or an unrelated githubkit change can uninstall it.
    "httpx>=0.28.1",
    # reader.py fetches the workload's own OIDC token through this for
    # Workload Identity Federation. Same reasoning as httpx above: importable
    # today only because google-cloud-storage pulls it in, and a dependency
    # this codebase calls directly must be declared or an unrelated storage
    # change can uninstall the reader's credential.
    "google-auth>=2.56.3",
    "google-cloud-storage>=3.13.1",
    "psycopg[binary]>=3.3.4",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "anthropic[vertex]>=0.120.2",
    "basedpyright>=1.40",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "scikit-learn>=1.9.0",
]

[project.scripts]
doug-backtest = "doug.backtest.cli:main"
doug-adjudicate = "doug.outcome_worker:main"
doug-review = "doug.review:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doug"
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B",
    # The mechanical half of review: blanket excepts, commented-out code, stray
    # prints, unused arguments, needless branches, bandit's security subset.
    "SIM", "C4", "PERF", "RUF", "PIE", "PGH", "RET", "PTH", "ARG", "BLE", "ERA",
    "T20", "S", "TRY",
    # Size limits. A function that fails one is a function to split.
    "C901", "PLR0912", "PLR0913", "PLR0915",
]
ignore = [
    # Typographic dashes, arrows and multiplication signs are ordinary prose.
    "RUF001", "RUF002", "RUF003",
    # Messages are written at the raise site: a refusal names what it refused,
    # and TRY301 would move the raise away from its reason.
    "TRY003", "TRY301",
    # Fires on every subprocess call and has no fix; S602 (shell=True) stays on.
    "S603",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Deliberate exceptions, each with its reason.
[tool.ruff.lint.extend-per-file-ignores]
# Scripts report by printing and call git by name.
"scripts/**" = ["T201", "S607"]
# Tests assert, use throwaway credentials and paths, run git by name, and
# request fixtures for their side effects.
"tests/**" = ["S101", "S105", "S106", "S108", "S607", "ARG001", "ARG002", "ARG005", "PLR0913"]

# Violations that predate a rule. Pay them down in the file you touch; the
# table only shrinks (.github/scripts/check_ratchets.py, `make ruff-debt`).
# Debt is `per-file-ignores` and the exceptions are `extend-per-file-ignores`,
# not the other way round: a `--config` override replaces this key but only
# extends the other, and the ratchet must see what fires without the debt.
[tool.ruff.lint.per-file-ignores]
# BEGIN ruff-debt (generated by `make ruff-debt`; it only shrinks)
