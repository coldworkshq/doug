[project]
name = "magpie-api"
version = "0.1.0"
description = "Magpie — risk-routed code review. Deterministic routing API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.140.7",
    "githubkit>=0.16.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[project.scripts]
magpie-backtest = "magpie.backtest.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "magpie"
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
