[project]
name = "doug-api"
version = "0.1.0"
description = "Doug — risk-routed code review. Deterministic routing API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic[vertex]>=0.120.2",
    "fastapi>=0.140.7",
    "githubkit[auth-app]>=0.16.0",
    # doug/tracing.py's only import, and the only place this repo touches it.
    # ADR-0031. It pulls the OpenTelemetry SDK in with it and installs a global
    # tracer provider on first use, which is why construction is lazy and
    # happens only when DOUG_TRACING is on.
    "langfuse>=4.15.1",
    # doug/workos_client.py's only transport. Importable today only because
    # githubkit pulls it in; a dependency this codebase calls directly must be
    # declared, or an unrelated githubkit change can uninstall it.
    "httpx>=0.28.1",
    # reader.py fetches the workload's own OIDC token through this for
    # Workload Identity Federation. Same reasoning as httpx above: importable
    # today only because google-cloud-storage pulls it in, and a dependency
    # this codebase calls directly must be declared or an unrelated storage
    # change can uninstall the reader's credential.
    "google-auth>=2.56.3",
    "google-cloud-storage>=3.13.1",
    "psycopg[binary]>=3.3.4",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "anthropic[vertex]>=0.120.2",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "scikit-learn>=1.9.0",
]

[project.scripts]
doug-backtest = "doug.backtest.cli:main"
doug-adjudicate = "doug.outcome_worker:main"
doug-review = "doug.review:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doug"
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
