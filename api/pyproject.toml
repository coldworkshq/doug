# Standard mode against .basedpyright/baseline.json, the errors that predate
# the gate (1,522 on 2026-09-13; strict mode reported 19,216). A fixed error
# shrinks the baseline, and `make check` fails until the smaller file is
# committed; only `make typecheck-baseline` grows it, and the ratchet refuses
# a baseline that grew past the merge base.
[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.14"
include = ["doug", "scripts", "tests"]
# tests/test_check_ratchets.py imports the ratchet script from here.
extraPaths = ["../.github/scripts"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
xfail_strict = true
