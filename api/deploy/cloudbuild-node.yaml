# Build a Node workspace image from the monorepo root.
# Substitutions: _IMAGE (full tag), _DOCKERFILE (e.g. web/Dockerfile).
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "-f", "${_DOCKERFILE}", "."]
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
